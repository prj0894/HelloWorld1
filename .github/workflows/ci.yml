name CI

on
  push
    branches [ main ]
  pull_request
    branches [ main ]

jobs
  test
    runs-on ubuntu-latest
    steps
      - name Checkout
        uses actionscheckout@v4

      - name Set up Python
        uses actionssetup-python@v4
        with
          python-version '3.11'

      - name Install dev deps
        run 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name Lint
        run 
          flake8 --max-line-length=88  true

      - name Run tests
        run 
          pytest -q  true
